name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: foto-log-app
  REGION: us-central1
  SERVICE: foto-log-web
  IMAGE: us-central1-docker.pkg.dev/foto-log-app/foto-log/web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/367642066122/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@foto-log-app.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # The Dockerfile builds on Docker Hardened Images, which need a Docker Hub sign-in to pull.
      - name: Sign in to dhi.io
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: echo "$DHI_TOKEN" | docker login dhi.io --username "$DHI_USERNAME" --password-stdin

      - name: Build and push image
        run: |
          # buildx's container builder, so the image carries an SBOM and provenance attestation.
          docker buildx create --use --driver docker-container
          docker buildx build --pull --provenance=mode=max --sbom=true --push -t "$IMAGE:${{ github.sha }}" .

      # The revision serving main now, to roll back to if the new one is unhealthy.
      - name: Note the current revision
        id: previous
        run: |
          prev=$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format=json | jq -r '[.status.traffic[]? | select(.tag == "main") | .revisionName][0] // empty')
          echo "Revision tagged main before this deploy: ${prev:-none}"
          echo "revision=$prev" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        run: |
          # The startup probe holds a new revision back until /health answers,
          # which also means it reached the database and ran migrations. A
          # revision that never gets healthy fails the deploy and gets no traffic.
          # It also runs on every cold start, so it polls often: up to 30 x 2s = 60s.
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE:${{ github.sha }}" \
            --tag=main \
            --startup-probe=httpGet.path=/health,initialDelaySeconds=0,periodSeconds=2,timeoutSeconds=2,failureThreshold=30 \
            --quiet
          # The "main" tag marks the revision deployed from main, so the
          # preview workflow's restore can find it. A --no-traffic deploy
          # (used to test a PR revision) pins traffic to a fixed revision,
          # and later deploys keep the pin. Always serve the revision just
          # deployed.
          gcloud run services update-traffic "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --to-latest \
            --quiet

      # Checks the site through the load balancer, as visitors reach it, and
      # waits until the new revision is the one answering: right after the
      # traffic switch, the previous revision may still answer for a moment.
      - name: Check foto-log.com is healthy
        id: health
        run: |
          revision=$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.latestReadyRevisionName)')
          echo "Expecting revision $revision"
          for attempt in $(seq 1 9); do
            if body=$(curl -fsS --max-time 10 -H "Cache-Control: no-cache" https://foto-log.com/health) \
              && echo "$body" | jq -e --arg rev "$revision" '.ok == true and .revision == $rev' > /dev/null; then
              echo "Healthy: $body"
              exit 0
            fi
            echo "Attempt $attempt: not healthy on $revision yet (${body:-no response})"
            sleep 10
          done
          echo "::error::foto-log.com/health didn't answer ok from $revision after the deploy."
          exit 1

      - name: Roll back to the previous revision
        if: failure() && steps.health.outcome == 'failure' && steps.previous.outputs.revision != ''
        env:
          PREVIOUS: ${{ steps.previous.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --to-revisions="$PREVIOUS=100" \
            --update-tags="main=$PREVIOUS" \
            --quiet
          echo "::error::Rolled back: foto-log.com is serving $PREVIOUS again."
          echo "The new revision failed its health check, so foto-log.com was rolled back to \`$PREVIOUS\`." >> "$GITHUB_STEP_SUMMARY"
